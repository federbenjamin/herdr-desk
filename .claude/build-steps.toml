# desk's build steps: the global /build flow names a step, this file names the command.
checks      = "go vet ./... && sh scripts/coverage.sh && test -z \"$(gofmt -l .)\" && shellcheck scripts/*.sh scripts/e2e/*.sh"
exit_checks = "go vet ./... && go test ./... && test -z \"$(gofmt -l .)\" && shellcheck scripts/*.sh scripts/e2e/*.sh"
tests       = "go test ./..."
install     = "go mod download"
notes       = ".claude/build/notes.md"
