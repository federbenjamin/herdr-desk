version: 2

project_name: herdr-desk

builds:
  - id: herdr-desk
    main: ./cmd/herdr-desk
    binary: herdr-desk
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X github.com/federbenjamin/herdr-desk/internal/version.Version={{ .Version }}

archives:
  - id: herdr-desk
    formats:
      - tar.gz
    name_template: "herdr-desk_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github-native

homebrew_casks:
  - name: herdr-desk
    repository:
      owner: federbenjamin
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/federbenjamin/herdr-desk
    description: A task board and session journal for people who work with coding agents.
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/herdr-desk"]
          end
